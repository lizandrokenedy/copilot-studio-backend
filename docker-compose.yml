version: "3.9"

services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: copilot
      MYSQL_USER: copilot
      MYSQL_PASSWORD: copilot
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  api:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: mysql://copilot:copilot@db:3306/copilot
      COPILOT_DIRECT_LINE_SECRET: ""
      DIRECT_LINE_BASE_URL: "https://directline.botframework.com/v3/directline"
      JWT_SECRET: ""
      JWT_EXPIRES_IN: "7d"
    ports:
      - "3000:3000"
    volumes:
      - ./prisma:/app/prisma
    depends_on:
      - db

volumes:
  db_data:
